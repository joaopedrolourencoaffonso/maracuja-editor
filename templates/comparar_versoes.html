<!DOCTYPE html>
<html>
    <head>
        <title>Capítulo {{ chapterID }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <style>
            :root {
                --ink: #243229;
                --muted: #6f7a70;
                --paper: #fffdf7;
                --line: #dfe6d8;
                --green-soft: #eef4e9;
                --green: #426548;
                --green-dark: #2f4d35;
            }

            * {
                box-sizing: border-box;
            }

            html, body {
                height: 100%;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 24px;
                color: var(--ink);
                background:
                    radial-gradient(circle at 8% 4%, rgba(66, 101, 72, .08), transparent 26rem),
                    linear-gradient(135deg, #fbfdf9 0%, var(--green-soft) 100%);
                font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            }

            .editor {
                display: grid;
                grid-template-columns: minmax(0, 5fr) minmax(0, 5fr);
                gap: 20px;
                width: 100%;
                min-height: calc(100vh - 48px);
            }

            .version-panel {
                display: flex;
                min-width: 0;
                flex-direction: column;
                padding: 16px 16px 18px;
                border: 1px solid var(--line);
                border-radius: 5px;
                background: rgba(255, 253, 247, .72);
                box-shadow: 0 10px 28px rgba(47, 77, 53, .06);
            }

            .version-label {
                display: block;
                min-height: 24px;
                margin: 0 4px 12px;
                color: var(--green-dark);
                font-family: Georgia, "Times New Roman", serif;
                font-size: 1.05rem;
                line-height: 1.4;
                overflow-wrap: anywhere;
            }

            .version-label::before {
                display: inline-block;
                width: 7px;
                height: 7px;
                margin: 0 9px 2px 0;
                border-radius: 50%;
                background: var(--green);
                content: "";
            }

            .iframeClass {
                display: block;
                width: 100%;
                min-height: 0;
                flex: 1;
                border: 1px solid var(--line);
                border-radius: 3px;
                background: var(--paper);
            }

            @media (max-width: 800px) {
                body {
                    height: auto;
                    padding: 14px;
                }

                .editor {
                    grid-template-columns: 1fr;
                    min-height: auto;
                }

                .version-panel {
                    min-height: 70vh;
                }

                .iframeClass {
                    min-height: 62vh;
                }
            }
        </style>

    </head>

        <!-- Create the editor container -->
        <div class="editor">

            </section>
        </div>

</html>
