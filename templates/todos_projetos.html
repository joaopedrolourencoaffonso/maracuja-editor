<!DOCTYPE html>
<html>
    <head>
        <title>Lista de Projetos</title>
        <style>
            .center {
                display: flex;
                justify-content: left; /* Centers horizontally */
                align-items: center;     /* Centers vertically */
            }

            .boxOfProjetos {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                align-items: center;
                justify-content: center;
                padding: 10px;
                width: 100%;
                gap: 10px;
            }

            .projetoBox {
                display: grid;
                grid-template-columns: minmax(0, 3fr) minmax(0, 7fr);
                padding: 10px;
                gap: 10px;
                width: 90%;
                height: 220px;
                box-sizing: border-box;
                border: 1px solid black;
                border-radius: 2%;
            }

            .projetoBox > div:first-child {
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
                min-height: 0;
            }

            .left {
                align-items: left;
                justify-content: left;
            }

            img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

            @media (max-width: 700px) {
                .boxOfProjetos {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
    </head>
    <body onload="populaPagina()">
        <!-- Include Quill stylesheet -->
        <a href="/">Voltar ao menu inicial</a>
        <a  href="/criar_projeto">Criar Projeto</a>
        <div class="campo">
            <h1 class="center">Meus Projetos</h1>
    
            <div class="boxOfProjetos" id="ListaDeProjetos">
            </div>
        </div>

        <br>

        <script>
            let livros;
            async function populaPagina() {
                const response = await fetch("/lista_todos_projetos");
                livros = await response.json();
                console.log(livros);
                let temp = "";
                
                Object.entries(livros).forEach(([key, value]) => {
                    console.log(key, value.titulo);
                    temp = temp + `<a href="/project_page/${key}">
                        <div class="projetoBox">
                            <div>
                                <img src="/img/${value.src}">
                            </div>
                            <div class="left">
                                <p>${value.titulo}</p>
                                <p>Número de capítulos: ${value.ncapitulos}</p>
                                <p>Número de timelines: ${value.ntimelines}</p>
                            </div>
                        </div>
                    </a>`
                });
                temp = temp + "</ul"
                
                var element = document.getElementById("ListaDeProjetos");
                element.innerHTML = temp;
            }
        </script>
    </body>

</html>
