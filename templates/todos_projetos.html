<!DOCTYPE html>
<html>
    <head>
        <title>Meus Projetos</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            :root {
                --ink: #243229;
                --muted: #6f7a70;
                --paper: #fffdf7;
                --line: #e7e9d9;
                --yellow: #f3c84b;
                --yellow-soft: #fff3bf;
                --green: #426548;
                --green-dark: #2f4d35;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                color: var(--ink);
                background:
                    radial-gradient(circle at 86% 7%, rgba(243, 200, 75, .18), transparent 28rem),
                    linear-gradient(135deg, #fffefb 0%, var(--paper) 55%, #f4f7e9 100%);
                font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            }

            .page-shell {
                width: min(100% - 40px, 980px);
                min-height: 100vh;
                margin: 0 auto;
                padding: 28px 0 52px;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 24px;
                margin-bottom: clamp(62px, 12vh, 116px);
            }

            .brand {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                color: var(--green-dark);
                font-family: Georgia, "Times New Roman", serif;
                font-size: 1.2rem;
                font-weight: bold;
                letter-spacing: .02em;
                text-decoration: none;
            }

            .brand-mark {
                display: grid;
                width: 30px;
                height: 30px;
                place-items: center;
                color: var(--green-dark);
                background: var(--yellow);
                border-radius: 50% 50% 50% 8px;
                font-size: .9rem;
                transform: rotate(-10deg);
            }

            .topbar-links {
                display: flex;
                gap: 22px;
            }

            .topbar-links a {
                color: var(--green);
                font-size: .85rem;
                text-decoration: none;
                border-bottom: 1px solid transparent;
                transition: color .2s ease, border-color .2s ease;
            }

            .topbar-links a:hover,
            .topbar-links a:focus-visible {
                color: var(--green-dark);
                border-color: var(--yellow);
                outline: none;
            }

            .projects-heading {
                display: flex;
                align-items: end;
                justify-content: space-between;
                gap: 24px;
                margin-bottom: 28px;
            }

            .eyebrow {
                margin: 0 0 14px;
                color: var(--green);
                font-size: .72rem;
                font-weight: bold;
                letter-spacing: .16em;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                color: var(--green-dark);
                font-family: Georgia, "Times New Roman", serif;
                font-size: clamp(2.6rem, 6vw, 4.5rem);
                font-weight: normal;
                letter-spacing: -.04em;
                line-height: .98;
            }

            .projects-heading span {
                color: var(--muted);
                font-size: .84rem;
            }

            .boxOfProjetos {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 16px;
                padding-top: 20px;
                border-top: 1px solid var(--line);
            }

            .boxOfProjetos > a {
                min-width: 0;
                color: inherit;
                text-decoration: none;
            }

            .projetoBox {
                display: grid;
                grid-template-columns: 112px minmax(0, 1fr);
                gap: 18px;
                min-height: 180px;
                padding: 14px;
                overflow: hidden;
                border: 1px solid var(--line);
                border-radius: 4px;
                background: rgba(255, 255, 255, .55);
                transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease, transform .2s ease;
            }

            .projetoBox > div:first-child {
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
                min-height: 0;
                overflow: hidden;
                border: 1px solid var(--line);
                background: var(--yellow-soft);
            }

            .left {
                display: flex;
                min-width: 0;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
            }

            .projetoBox img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .projetoBox p {
                margin: 0;
            }

            .projetoBox p:first-child {
                display: -webkit-box;
                margin-bottom: 12px;
                overflow: hidden;
                color: var(--green-dark);
                font: bold 1.15rem/1.3 Georgia, "Times New Roman", serif;
                overflow-wrap: anywhere;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
            }

            .projetoBox p:last-child {
                color: var(--muted);
                font-size: .8rem;
                line-height: 1.4;
            }

            .boxOfProjetos > a:hover .projetoBox,
            .boxOfProjetos > a:focus-visible .projetoBox {
                border-color: var(--yellow);
                background: var(--yellow-soft);
                box-shadow: 0 8px 22px rgba(47, 77, 53, .08);
                outline: none;
                transform: translateY(-2px);
            }

            @media (max-width: 700px) {
                .page-shell {
                    width: min(100% - 28px, 540px);
                    padding-top: 20px;
                }

                .topbar {
                    align-items: flex-start;
                    margin-bottom: 76px;
                }

                .topbar-links {
                    flex-direction: column;
                    align-items: flex-end;
                    gap: 7px;
                }

                .projects-heading {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 9px;
                }

                .boxOfProjetos {
                    grid-template-columns: minmax(0, 1fr);
                }
            }
        </style>
    </head>
    <body onload="populaPagina()">
        <main class="page-shell">
            <nav class="topbar" aria-label="Navegação principal">
                <a class="brand" href="/">
                    <span class="brand-mark" aria-hidden="true">m</span>
                    <span>Maracujá</span>
                </a>
                <div class="topbar-links">
                    <a href="/">Início</a>
                    <a href="/criar_projeto">Criar projeto</a>
                </div>
            </nav>

            <section class="projects-heading" aria-labelledby="projects-title">
                <div>
                    <p class="eyebrow">Tudo o que você está criando</p>
                    <h1 id="projects-title">Meus projetos</h1>
                </div>
                <span>Escolha uma história para continuar</span>
            </section>
    
            <div class="boxOfProjetos" id="ListaDeProjetos">
            </div>
        </main>

        <br>

        <script>
            let livros;
            async function populaPagina() {
                const response = await fetch("/lista_todos_projetos");
                livros = await response.json();
                console.log(livros);
                let temp = "";
                
                Object.entries(livros).forEach(([key, value]) => {
                    console.log(key, value.titulo);
                    temp = temp + `<a href="/project_page/${key}">
                        <div class="projetoBox">
                            <div>
                                <img src="/img/${value.src}">
                            </div>
                            <div class="left">
                                <p>${value.titulo}</p>
                                <p>Número de capítulos: ${value.ncapitulos}</p>
                            </div>
                        </div>
                    </a>`
                });
                temp = temp + "</ul"
                
                var element = document.getElementById("ListaDeProjetos");
                element.innerHTML = temp;
            }
        </script>
    </body>

</html>
