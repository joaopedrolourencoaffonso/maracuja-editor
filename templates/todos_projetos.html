<!DOCTYPE html>
<html>
    <head>
        <title>Lista de Projetos</title>
        <style>
            .center {
                display: flex;
                justify-content: left; /* Centers horizontally */
                align-items: center;     /* Centers vertically */
            }
        </style>
    </head>
    <body onload="populaPagina()">
        <!-- Include Quill stylesheet -->
        <div class="campo">
            <h1 class="center">Projetos Cadastrados</h1>
    
            <div class="center" id="ListaDeLivros">
            </div>
        </div>

        <script>
            let livros;
            async function populaPagina() {
                const response = await fetch("/lista_todos_projetos");
                livros = await response.json();
                console.log(livros);
                let temp = `<ul>`;
                
                Object.entries(livros).forEach(([key, value]) => {
                    temp = temp + `<li><a href="/project_page/${value}">${key}</a></li>`;
                });
                temp = temp + "</ul"
                
                var element = document.getElementById("ListaDeLivros");
                element.innerHTML = temp;
            }
        </script>
    </body>

</html>
