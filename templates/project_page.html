<!DOCTYPE html>
<html>
    <head>
        <title>Projeto</title>
        <style>
            .infoProjeto {
                display: grid;
                grid-template-columns: 30% 70%;
                width: 100%;
                align-items: start;
            }

            .infoProjeto > div:first-child {
                width: 100%;
            }

            .infoProjeto > div:last-child {
                width: 100%;
                min-width: 0;
                overflow-wrap: break-word;
            }

            .imagemBotao {
                position: relative;
                border: none;
                padding: 0;
                background: none;
                cursor: pointer;
            }

            .imagemBotao img {
                display: block;
            }

            .imagemHover {
                display: none !important;
            }

            .imagemBotao:hover .imagemNormal {
                display: none !important;
            }

            .imagemBotao:hover .imagemHover {
                display: block !important;
            }

            img {
                width: 95%;
                align-items: center;
            }
        </style>
    </head>
    <body onload="populaPagina()">
        <div>
            <button onclick="salvaInfo()">Salvar Mudanças</button>
            <a href="/">Voltar para a página principal</a>
            <br><br>
        </div>

        <div class="campo" id="campo">
            <div class="infoProjeto">
                <div>
                    <input type="file" id="fileInput" style="display: none;">
                    <button class="imagemBotao" type="button" onclick="document.getElementById('fileInput').click()">
                        <img class="imagemNormal" src="/img/CAPA_DO_PROJETO" alt="" id="imageCapa">
                        <img class="imagemHover" src="/img_app/2" alt="">
                    </button>
                </div>
                <div>
                    <h2>Título do Projeto</h2>
                    <textarea id="tituloField" rows="2" cols="100"></textarea>

                    <h2>Sinopse</h2>
                    <textarea id="sinopseField" rows="2" cols="100"></textarea>

                    <div>
                        <a href="/editarCapitulo/?project_id={{ projectID }}&chapter_id=Novo">Criar Capítulo</a>
                    </div>

                    <h2>Capítulos</h2>
                    <ul id="listaDeCapitulos">

                    </ul>
                </div>
            </div>
        </div>

        <script>
            let livros;
            let titulo;
            let sinopse;
            let capa;
            let selectedFile;
            let fileInput;
            let preview;
            const projectID = "{{ projectID }}";
            console.log("--> ",projectID);


            async function populaPagina() {
                const response = await fetch("/project_info/" + projectID);
                projectData = await response.json();
                console.log(projectData.name);
                let temp = ``;

                titulo = projectData.name;
                sinopse = projectData.sinopse;
                capa = projectData.capa;
                
                listaHTML = ""
                projectData.capitulos.forEach(capitulo => {
                    listaHTML = listaHTML + `<li><a href="/editarCapitulo/?chapter_id=${capitulo[0]}&project_id=${projectID}">${capitulo[1]}</a></li>`;
                });
                listaHTML = listaHTML;
                var lista = document.getElementById("listaDeCapitulos")
                lista.innerHTML = listaHTML;

                var element = document.getElementById("campo");
                
                document.getElementById("tituloField").value = projectData.name;
                document.getElementById("sinopseField").value = projectData.sinopse;
                document.getElementById("imageCapa").src = "/img/" + projectData.capa;

                fileInput = document.getElementById("fileInput");
                preview = document.getElementById("imageCapa");
                fileInput.addEventListener("change", () => {
                    selectedFile = fileInput.files[0];

                    if (!selectedFile) return;

                    preview.src = URL.createObjectURL(selectedFile);
                    preview.style.display = "block";
                });
            }

            function salvaInfo() {
                console.log(titulo, sinopse, fileInput.files[0]);

                let novo_titulo = document.getElementById("tituloField").value;
                let nova_sinopse = document.getElementById("sinopseField").value;

                console.log(novo_titulo, nova_sinopse);

                const formData = new FormData();
                formData.append("project_id", projectID);
                formData.append("titulo", novo_titulo);
                formData.append("sinopse", nova_sinopse);
                formData.append("image",fileInput.files[0]);

                chamaAPI(formData).then(dados => {
                    resultado = dados;
                    if (resultado.msg == 'ok') {
                        alert("Atualizado com sucesso!")
                        window.location.href = `/project_page/${projectID}`
                    }
                })
                .catch(erro => {
                    console.error(erro);
                });
            }

            async function chamaAPI(formData) {
                const response = await fetch("/atualiza_projeto_info", {
                   method: "POST",
                   body: formData
                });
                return response.json();
            }
        </script>
    </body>

</html>
