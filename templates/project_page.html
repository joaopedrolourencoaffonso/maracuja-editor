<!DOCTYPE html>
<html>
    <head>
        <title>Projeto</title>
        <style>
            .infoProjeto {
                display: grid;
                grid-template-columns: 30% 70%;
                width: 100%;
                align-items: start;
            }

            .infoProjeto > div:first-child {
                width: 100%;
            }

            .infoProjeto > div:last-child {
                width: 100%;
                min-width: 0;
                overflow-wrap: break-word;
            }

            .imagemBotao {
                position: relative;
                border: none;
                padding: 0;
                background: none;
                cursor: pointer;
            }

            .imagemBotao img {
                display: block;
            }

            .imagemHover {
                display: none !important;
            }

            .imagemBotao:hover .imagemNormal {
                display: none !important;
            }

            .imagemBotao:hover .imagemHover {
                display: block !important;
            }

            img {
                width: 95%;
                align-items: center;
            }
        </style>
    </head>
    <body onload="populaPagina()">
        <div>
            <button onclick="salvaInfo()">Salvar Mudanças</button>
            <a href="/">Voltar para a página principal</a>
            <br><br>
        </div>

        <div class="campo" id="campo">
            
        </div>

        <script>
            let livros;
            let titulo;
            let sinopse;
            let capa;
            let selectedFile;
            const projectID = "{{ projectID }}";
            console.log("--> ",projectID);


            async function populaPagina() {
                const response = await fetch("/project_info/" + projectID);
                projectData = await response.json();
                console.log(projectData.name);
                let temp = `
                <div class="infoProjeto">
                    <div>
                        <input type="file" id="fileInput" style="display: none;">
                        <button class="imagemBotao" type="button" onclick="document.getElementById('fileInput').click()">
                            <img class="imagemNormal" src="/img/CAPA_DO_PROJETO" alt="" id="imageCapa">
                            <img class="imagemHover" src="/img_app/2" alt="">
                        </button>
                    </div>
                    <div>
                        <h2>Título do Projeto</h2>
                        <textarea id="tituloField" rows="2" cols="100">TITULO_DO_PROJETO</textarea>

                        <h2>Sinopse</h2>
                        <textarea id="sinopseField" rows="2" cols="100">SINOPSE_DO_PROJETO</textarea>

                        <h2>Capítulos</h2>
                        LISTA_VAI_AQUI
                    </div>
                </div>
                `;

                temp = temp.replace("TITULO_DO_PROJETO",projectData.name);
                temp = temp.replace("CAPA_DO_PROJETO",projectData.capa);
                temp = temp.replace("SINOPSE_DO_PROJETO",projectData.sinopse);

                titulo = projectData.name;
                sinopse = projectData.sinopse;
                capa = projectData.capa;
                
                listaHTML = "<ul>"
                projectData.capitulos.forEach(capitulo => {
                    listaHTML = listaHTML + `<li>${capitulo}</li>`;
                });
                listaHTML = listaHTML + "</ul>";
                temp = temp.replace("LISTA_VAI_AQUI",listaHTML);

                var element = document.getElementById("campo");
                element.innerHTML = temp;

                const fileInput = document.getElementById("fileInput");
                const preview = document.getElementById("imageCapa");
                fileInput.addEventListener("change", () => {
                    selectedFile = fileInput.files[0];

                    if (!selectedFile) return;

                    preview.src = URL.createObjectURL(selectedFile);
                    preview.style.display = "block";
                });
            }

            function salvaInfo() {
                console.log("CONTINUAR DAQUI!");
            }
        </script>
    </body>

</html>
