<!DOCTYPE html>
<html>
    <head>
        <title>Maracujá</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            :root {
                --ink: #243229;
                --muted: #6f7a70;
                --paper: #fffdf7;
                --line: #e7e9d9;
                --yellow: #f3c84b;
                --yellow-soft: #fff3bf;
                --green: #426548;
                --green-dark: #2f4d35;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                color: var(--ink);
                background:
                    radial-gradient(circle at 86% 7%, rgba(243, 200, 75, .18), transparent 28rem),
                    linear-gradient(135deg, #fffefb 0%, var(--paper) 55%, #f4f7e9 100%);
                font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            }

            .page-shell {
                width: min(100% - 40px, 980px);
                min-height: 100vh;
                margin: 0 auto;
                padding: 28px 0 52px;
            }

            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 24px;
                margin-bottom: clamp(70px, 14vh, 150px);
            }

            .brand {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                color: var(--green-dark);
                font-family: Georgia, "Times New Roman", serif;
                font-size: 1.2rem;
                font-weight: bold;
                letter-spacing: .02em;
                text-decoration: none;
            }

            .brand-mark {
                display: grid;
                width: 30px;
                height: 30px;
                place-items: center;
                color: var(--green-dark);
                background: var(--yellow);
                border-radius: 50% 50% 50% 8px;
                font-size: .9rem;
                transform: rotate(-10deg);
            }

            .settings-link {
                color: var(--green);
                font-size: .85rem;
                text-decoration: none;
                border-bottom: 1px solid transparent;
                transition: color .2s ease, border-color .2s ease;
            }

            .settings-link:hover,
            .settings-link:focus-visible {
                color: var(--green-dark);
                border-color: var(--yellow);
                outline: none;
            }

            .welcome {
                max-width: 720px;
                margin: 0 auto;
                text-align: center;
            }

            .eyebrow {
                margin: 0 0 14px;
                color: var(--green);
                font-size: .72rem;
                font-weight: bold;
                letter-spacing: .16em;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                color: var(--green-dark);
                font-family: Georgia, "Times New Roman", serif;
                font-size: clamp(2.7rem, 7vw, 5rem);
                font-weight: normal;
                letter-spacing: -.04em;
                line-height: .98;
            }

            .intro {
                max-width: 440px;
                margin: 18px auto 0;
                color: var(--muted);
                font-size: .98rem;
                line-height: 1.65;
            }

            .projects-section {
                max-width: 620px;
                margin: 62px auto 0;
                text-align: left;
            }

            .section-heading {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 20px;
                padding-bottom: 13px;
                border-bottom: 1px solid var(--line);
            }

            .section-heading h2 {
                margin: 0;
                color: var(--green-dark);
                font-family: Georgia, "Times New Roman", serif;
                font-size: 1.35rem;
                font-weight: normal;
            }

            .section-heading span {
                color: var(--muted);
                font-size: .78rem;
            }

            #ListaDeProjetos {
                display: block;
                margin-top: 8px;
            }

            #ListaDeProjetos ul {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px 18px;
                margin: 0;
                padding: 0;
                list-style: none;
            }

            #ListaDeProjetos li {
                border-bottom: 1px solid var(--line);
            }

            #ListaDeProjetos a {
                display: flex;
                align-items: center;
                min-height: 58px;
                padding: 8px 10px;
                color: var(--ink);
                font-family: Georgia, "Times New Roman", serif;
                font-size: 1.02rem;
                text-decoration: none;
                transition: color .2s ease, background-color .2s ease, padding-left .2s ease;
            }

            #ListaDeProjetos a::before {
                width: 7px;
                height: 7px;
                margin-right: 12px;
                flex: 0 0 auto;
                background: var(--yellow);
                border-radius: 50%;
                content: "";
            }

            #ListaDeProjetos a:hover,
            #ListaDeProjetos a:focus-visible {
                padding-left: 14px;
                color: var(--green-dark);
                background: rgba(255, 243, 191, .45);
                outline: none;
            }

            .actions {
                display: flex;
                justify-content: center;
                gap: 12px;
                margin-top: 42px;
            }

            .action-link {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 44px;
                padding: 10px 18px;
                border: 1px solid var(--green);
                border-radius: 3px;
                color: var(--green-dark);
                font-size: .85rem;
                text-decoration: none;
                transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
            }

            .action-link.primary {
                border-color: var(--yellow);
                background: var(--yellow);
            }

            .action-link:hover,
            .action-link:focus-visible {
                border-color: var(--green-dark);
                background: var(--yellow-soft);
                outline: none;
                transform: translateY(-1px);
            }

            .action-link.primary:hover,
            .action-link.primary:focus-visible {
                background: #f7d766;
            }

            @media (max-width: 600px) {
                .page-shell {
                    width: min(100% - 28px, 520px);
                    padding-top: 20px;
                }

                .topbar {
                    margin-bottom: 84px;
                }

                #ListaDeProjetos ul {
                    grid-template-columns: 1fr;
                }

                .actions {
                    flex-direction: column;
                }

                .action-link {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body onload="populaPagina()">
        <main class="page-shell">
            <nav class="topbar" aria-label="Navegação principal">
                <a class="brand" href="/">
                    <span class="brand-mark" aria-hidden="true">m</span>
                    <span>Maracujá</span>
                </a>
                <a class="settings-link" href="/settings">Configurações</a>
            </nav>

            <section class="welcome" aria-labelledby="welcome-title">
                <p class="eyebrow">Seu espaço de escrita</p>
                <h1 id="welcome-title">Vamos criar!</h1>
                <p class="intro">Retome uma ideia ou abra uma nova página para deixar as palavras encontrarem seu caminho.</p>
            </section>

            <section class="projects-section" aria-labelledby="projects-title">
                <div class="section-heading">
                    <h2 id="projects-title">Projetos recentes</h2>
                    <span>Continue de onde parou</span>
                </div>
                <div id="ListaDeProjetos"></div>
                <div class="actions">
                    <a class="action-link" href="/todos_projetos">Ver todos os projetos</a>
                    <a class="action-link primary" href="/criar_projeto">Criar novo projeto</a>
                </div>
            </section>
        </main>

        <script>
            let projetos;
            async function populaPagina() {
                const response = await fetch("/lista_projetos_recentes");
                projetos = await response.json();
                console.log("--> ", projetos);
                let temp = `<ul>`;
                
                Object.entries(projetos).forEach(([key, value]) => {
                    temp = temp + `<li><a href="/project_page/${value}">${key}</a></li>`;
                });
                temp = temp + "</ul"
                
                var element = document.getElementById("ListaDeProjetos");
                element.innerHTML = temp;
            }
        </script>
    </body>

</html>
